name: newsradar

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: newsradar-postgres
    environment:
      POSTGRES_USER: newsradar
      POSTGRES_PASSWORD: newsradar
      POSTGRES_DB: newsradar
    ports:
      - "5433:5432"
    volumes:
      - newsradar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsradar -d newsradar"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: newsradar-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  newsradar_pgdata:
